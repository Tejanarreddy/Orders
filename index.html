<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>📦 Orders Management System</h1>
      <p>Simple order tracking dashboard</p>
    </div>
    <button id="clearAllBtn" class="danger">Clear All</button>
  </header>

  <main>
    <section class="stats">
      <div class="card"><span>Total Orders</span><strong id="totalOrders">0</strong></div>
      <div class="card"><span>Pending</span><strong id="pendingOrders">0</strong></div>
      <div class="card"><span>Completed</span><strong id="completedOrders">0</strong></div>
      <div class="card"><span>Total Sales</span><strong id="totalSales">₹0.00</strong></div>
    </section>

    <section class="panel">
      <h2>➕ Add New Order</h2>
      <form id="orderForm">
        <div class="grid">
          <label>Customer Name
            <input id="customer" required placeholder="Enter customer name">
          </label>
          <label>Phone
            <input id="phone" required inputmode="tel" placeholder="Enter phone number">
          </label>
          <label>Product
            <input id="product" required placeholder="Enter product">
          </label>
          <label>Quantity
            <input id="quantity" type="number" min="1" value="1" required>
          </label>
          <label>Price (₹)
            <input id="price" type="number" min="0" step="0.01" required placeholder="0">
          </label>
          <label>Status
            <select id="status">
              <option>Pending</option>
              <option>Processing</option>
              <option>Completed</option>
              <option>Cancelled</option>
            </select>
          </label>
        </div>
        <button class="primary" type="submit">Add Order</button>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>📋 Orders</h2>
        <input id="search" placeholder="Search customer, phone or product...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Customer</th><th>Phone</th><th>Product</th>
              <th>Qty</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <p id="empty" class="empty">No orders yet. Add your first order above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
